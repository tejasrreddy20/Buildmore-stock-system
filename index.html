<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buildmore Ventures — Inventory Control</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    /* Requirement 1: Only B with orange text and white background */
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-color: #ffffff;
      color: #f97316;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .brand-sub { font-size: 12px; color: var(--muted); }

    .nav-section { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin: 12px 8px 8px; }
    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 4px;
    }
    .nav-btn:hover { background: #f1f5f9; }
    .nav-btn.active { background: #fff7ed; color: var(--orange-dark); font-weight: 600; }

    .sync-badge {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--green);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; }

    /* Top Header - Requirement 2: Clean search bar without 3-option tool */
    .topbar {
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      gap: 16px;
    }
    .search-box {
      width: 100%;
      max-width: 420px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: var(--orange); }

    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .alert-pill {
      background: #fef2f2;
      color: var(--red);
      border: 1px solid #fecaca;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Workspace */
    .content { padding: 24px; max-width: 1200px; width: 100%; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 20px; font-weight: 700; }

    .btn-primary {
      background: var(--orange);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--orange-dark); }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; }

    /* Table */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f8fafc; font-size: 12px; text-transform: uppercase; color: var(--muted); }
    tr:last-child td { border-bottom: none; }

    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-ok { background: #dcfce7; color: var(--green); }
    .badge-low { background: #fee2e2; color: var(--red); }

    .action-btn {
      border: 1px solid var(--border);
      background: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-right: 4px;
    }
    .action-btn:hover { background: #f1f5f9; }
    .action-btn.delete { color: var(--red); border-color: #fecaca; }
    .action-btn.delete:hover { background: #fef2f2; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal h2 { font-size: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  </style>
</head>
<body>

  <!-- Sidebar (Requirement 3: Reports & Analytics removed) -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-label="Buildmore">B</div>
      <div>
        <div class="brand-title">Buildmore Ventures</div>
        <div class="brand-sub">Inventory Control</div>
      </div>
    </div>

    <div class="nav-section">Operations</div>
    <button class="nav-btn active" data-filter="all" onclick="setFilter('all', this)">All Stock Items</button>
    <button class="nav-btn" data-filter="low" onclick="setFilter('low', this)">Low Stock Alerts</button>

    <div class="nav-section">Administration</div>
    <button class="nav-btn" onclick="openModal()">+ Add New Product</button>

    <div class="sync-badge">
      <span class="sync-dot"></span>
      <span>Live sync active</span>
    </div>
  </aside>

  <!-- Main Workspace -->
  <div class="main">
    <header class="topbar">
      <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search by SKU, item name, or category..."
        oninput="render()"
      />
      <div class="topbar-right">
        <span class="alert-pill" id="alertPill">0 Active Stock Alerts</span>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <h1 id="viewTitle">Stock Inventory</h1>
        <button class="btn-primary" onclick="openModal()">+ Add Stock Item</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total SKUs</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Units in Stock</div>
          <div class="stat-value" id="statUnits">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Low Stock Items</div>
          <div class="stat-value" id="statLow" style="color: var(--red);">0</div>
        </div>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>SKU</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Min Alert Level</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="stockTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-backdrop" id="itemModal">
    <div class="modal">
      <h2 id="modalTitle">Add Stock Item</h2>
      <form id="stockForm" onsubmit="saveItem(event)">
        <input type="hidden" id="itemId" />
        <div class="form-group">
          <label for="sku">SKU Code</label>
          <input type="text" id="sku" required placeholder="e.g., TIL-204" />
        </div>
        <div class="form-group">
          <label for="name">Item Name</label>
          <input type="text" id="name" required placeholder="e.g., Vitrified Floor Tile 2x2" />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="Tiles">Tiles</option>
            <option value="Sanitaryware">Sanitaryware</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Paints">Paints</option>
            <option value="Hardware">Hardware</option>
          </select>
        </div>
        <div class="form-group">
          <label for="qty">Current Quantity</label>
          <input type="number" id="qty" min="0" required />
        </div>
        <div class="form-group">
          <label for="minQty">Minimum Stock Alert Level</label>
          <input type="number" id="minQty" min="0" value="10" required />
        </div>
        <div class="modal-actions">
          <button type="button" class="action-btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Stock</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "buildmore_inventory_v1";
    let currentFilter = "all";

    // Load initial stock from localStorage (or seed sample items on first run)
    let stockItems = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: "1", sku: "TIL-101", name: "Glossy Vitrified Tile 2x4", category: "Tiles", qty: 45, minQty: 15 },
      { id: "2", sku: "SAN-202", name: "Ceramic Wall Hung Closet", category: "Sanitaryware", qty: 6, minQty: 10 },
      { id: "3", sku: "PLM-305", name: "CPVC Pipe 1 Inch (10ft)", category: "Plumbing", qty: 80, minQty: 20 }
    ];

    function persistAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stockItems));
      render();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("viewTitle").textContent =
        filter === "low" ? "Active Low Stock Alerts" : "Stock Inventory";
      render();
    }

    function render() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const tbody = document.getElementById("stockTableBody");

      const lowStockCount = stockItems.filter(i => Number(i.qty) <= Number(i.minQty)).length;
      const totalUnits = stockItems.reduce((sum, i) => sum + Number(i.qty), 0);

      document.getElementById("statTotal").textContent = stockItems.length;
      document.getElementById("statUnits").textContent = totalUnits;
      document.getElementById("statLow").textContent = lowStockCount;
      document.getElementById("alertPill").textContent = `${lowStockCount} Active Stock Alerts`;

      const filtered = stockItems.filter(item => {
        const matchesSearch =
          item.sku.toLowerCase().includes(query) ||
          item.name.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query);
        const matchesFilter =
          currentFilter === "all" || Number(item.qty) <= Number(item.minQty);
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding:24px;">No stock items found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const isLow = Number(item.qty) <= Number(item.minQty);
        return `
          <tr>
            <td><strong>${escapeHtml(item.sku)}</strong></td>
            <td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.category)}</td>
            <td><strong>${item.qty}</strong></td>
            <td>${item.minQty}</td>
            <td>
              <span class="badge ${isLow ? "badge-low" : "badge-ok"}">
                ${isLow ? "Low Stock" : "In Stock"}
              </span>
            </td>
            <td>
              <button class="action-btn" onclick="adjustQty('${item.id}', 1)">+1</button>
              <button class="action-btn" onclick="adjustQty('${item.id}', -1)">-1</button>
              <button class="action-btn" onclick="editItem('${item.id}')">Edit</button>
              <button class="action-btn delete" onclick="deleteItem('${item.id}')">Delete</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    // Requirement 4: Immediate Save & Update
    function saveItem(event) {
      event.preventDefault();
      const id = document.getElementById("itemId").value;
      const newItem = {
        id: id || String(Date.now()),
        sku: document.getElementById("sku").value.trim(),
        name: document.getElementById("name").value.trim(),
        category: document.getElementById("category").value,
        qty: Math.max(0, Number(document.getElementById("qty").value)),
        minQty: Math.max(0, Number(document.getElementById("minQty").value))
      };

      if (id) {
        stockItems = stockItems.map(item => (item.id === id ? newItem : item));
      } else {
        stockItems = [newItem, ...stockItems];
      }

      persistAndRender();
      closeModal();
    }

    function adjustQty(id, delta) {
      stockItems = stockItems.map(item =>
        item.id === id ? { ...item, qty: Math.max(0, Number(item.qty) + delta) } : item
      );
      persistAndRender();
    }

    // Requirement 4: Immediate Delete
    function deleteItem(id) {
      stockItems = stockItems.filter(item => item.id !== id);
      persistAndRender();
    }

    function editItem(id) {
      const item = stockItems.find(i => i.id === id);
      if (!item) return;
      document.getElementById("modalTitle").textContent = "Edit Stock Item";
      document.getElementById("itemId").value = item.id;
      document.getElementById("sku").value = item.sku;
      document.getElementById("name").value = item.name;
      document.getElementById("category").value = item.category;
      document.getElementById("qty").value = item.qty;
      document.getElementById("minQty").value = item.minQty;
      document.getElementById("itemModal").classList.add("open");
    }

    function openModal() {
      document.getElementById("modalTitle").textContent = "Add Stock Item";
      document.getElementById("stockForm").reset();
      document.getElementById("itemId").value = "";
      document.getElementById("itemModal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("itemModal").classList.remove("open");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    render();
  </script>
</body>
</html>
